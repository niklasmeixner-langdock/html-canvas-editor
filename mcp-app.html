<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Langdock slide canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <strong id="deck-title">Langdock slides</strong>
          <span id="status">Loading…</span>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" id="play-btn" type="button" title="Preview this slide's entrance animation">Play</button>
          <button class="btn ghost" id="fit-btn" type="button">Fit</button>
          <button class="btn ghost" id="reset-btn" type="button">Reset</button>
          <span class="sep"></span>
          <button class="btn" id="copy-btn" type="button">Copy</button>
          <button class="btn" id="download-btn" type="button">Download</button>
          <button class="btn primary" id="save-btn" type="button">Save</button>
          <!-- Side panel only: toggle the tool/layer/props panels, or go full screen. -->
          <button class="btn icon" id="panels-btn" type="button" title="Show panels" aria-label="Show panels" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M9 5v14M15 5v14" /></svg>
          </button>
          <button class="btn icon" id="maximize-btn" type="button" title="Full screen" aria-label="Full screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" /></svg>
          </button>
        </div>
      </header>
      <div class="workspace">
        <aside class="rail">
          <h2>Insert</h2>
          <div class="tool-list">
            <button class="tool active" data-tool="select" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
                <path d="M4 4l8 16 2-7 7-2z" />
              </svg>
              <span>Select</span>
              <kbd>V</kbd>
            </button>
            <button class="tool" data-tool="text" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <path d="M5 6h14M12 6v14" />
              </svg>
              <span>Text</span>
              <kbd>T</kbd>
            </button>
            <button class="tool" data-tool="image" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
                <rect x="4" y="5" width="16" height="14" rx="2" />
                <path d="M8 13l3-3 6 6" />
                <circle cx="9" cy="9" r="1.2" fill="currentColor" />
              </svg>
              <span>Image</span>
              <kbd>I</kbd>
            </button>
            <button class="tool" data-tool="container" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <rect x="5" y="5" width="14" height="14" rx="2" />
              </svg>
              <span>Frame</span>
              <kbd>F</kbd>
            </button>
          </div>
          <div class="rail-head">
            <h2>Layers</h2>
            <div class="layer-actions">
              <button id="front-btn" type="button" title="Bring forward" aria-label="Bring forward">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
              </button>
              <button id="back-btn" type="button" title="Send back" aria-label="Send back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
              </button>
              <button id="delete-btn" type="button" title="Delete" aria-label="Delete">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12" /></svg>
              </button>
            </div>
          </div>
          <div class="layers" id="layers"></div>
        </aside>
        <div class="viewport-wrap">
          <div id="viewport">
            <div id="stage">
              <div id="slide"></div>
              <div id="overlay"></div>
            </div>
          </div>
        </div>
        <aside class="props" id="props"></aside>
      </div>
      <div class="filmstrip">
        <div class="thumbs" id="thumbs"></div>
        <button class="add-slide" id="add-slide" type="button" title="Add slide" aria-label="Add slide">+</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden />
    </div>
    <!-- Replaced by the MCP server with its public URL when served as an app resource. -->
    <script>window.__CANVAS_BASE__="";</script>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
